[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "futures-agent-os"
version = "0.0.1"
description = "Greenfield agentic futures research and simulation system"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
  { name = "futures-agent-os contributors" },
]
dependencies = []

[project.scripts]
futures-agent-os = "futures_agent_os.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futures_agent_os"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

