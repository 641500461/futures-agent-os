[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "futures-agent-os"
version = "0.0.1"
description = "Greenfield agentic futures research and simulation system"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
  { name = "futures-agent-os contributors" },
]
dependencies = [
  "alembic>=1.16,<2",
  "openai>=2,<3",
  "openai-codex>=0.1,<1",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.scripts]
futures-agent-os = "futures_agent_os.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.151,<7",
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "ruff>=0.15,<1",
  "detect-secrets>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futures_agent_os"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
# Keep the initial repository gate focused on correctness.  Broader style
# migrations are deliberately separate from this quality-baseline task.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
